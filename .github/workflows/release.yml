# Container image of a release: on a release tag vX.Y.Z, run the tests for the tagged commit
# (test.yml), then build linux/amd64 + linux/arm64 (cross-built without emulation, see the
# Dockerfile), push it to ghcr.io/<this repository> as :vX.Y.Z — and as :latest only when the
# tag is the highest release version — and sign it.
#
# Manual fallback, should GitHub not start the workflow for a pushed tag: Actions → release →
# Run workflow, "Use workflow from" the tag and the same tag as input `tag`. Anything else is
# refused (job `tag`): the run must be on the tag itself, so that the tests, the image and the
# signature's identity (…/release.yml@refs/tags/vX.Y.Z, checked by `cosign verify`) all name it.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its version;
# Dependabot proposes updates). The image carries build provenance (SLSA, mode=max) and an
# SBOM as attestations, and is signed keylessly with cosign (Sigstore, the workflow's OIDC
# identity): `cosign verify` in the README checks that an image was built by this workflow
# from a release tag of this repository.
#
# Uses the workflow's own GITHUB_TOKEN (packages: write) and OIDC token (id-token: write,
# for the signature only); no other secret.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag vX.Y.Z (choose the same tag under \"Use workflow from\")"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Existing release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a release tag vX.Y.Z" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "run this workflow from the tag $TAG (\"Use workflow from\" → Tags → $TAG), not from $GITHUB_REF" >&2
            exit 1
          fi

  test:
    needs: tag
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}  # the release tag (job `tag`)
          fetch-depth: 0  # all release tags, to decide about :latest
          persist-credentials: false

      - name: Release version and tags
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$GITHUB_REF_NAME is not a release tag vX.Y.Z" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          highest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$GITHUB_REF_NAME"
            if [ "$highest" = "$GITHUB_REF_NAME" ]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "highest release tag: $highest"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: smoke
          pull: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
