# Tests on every push and pull request, and as the first job of a release (release.yml calls
# this workflow for the tagged commit, so no image is built from a red commit).
#
# Read-only token, no secret. The runtime dependencies are installed from the hashed lock
# file (requirements.txt), the versions the image ships.
name: test

on:
  push:
    branches: ["**"]  # a release tag runs the tests through release.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt
          python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Test
        run: |
          python -m compileall -q src tests
          python -m pytest
