# Update proposals for every pinned input of the build: the Python dependencies (pyproject.toml
# and the hashed lock file requirements.txt, generated by pip-compile), the base image digest
# in the Dockerfile and the commit SHAs of the GitHub Actions. Each proposal is a pull request
# that the tests check; nothing is updated without review.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
